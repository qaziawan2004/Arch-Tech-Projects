<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <header>
        <nav class="nav">
            <h2 onclick="home()">Todo App</h2>
            <a href="./Login.html">Login</a>
            <a href="./SignUp.html">Create Account</a>
        </nav>
    </header>
    <div class="sign-container" style="justify-self: center;">
    <h1>Create Account</h1>
    <form action="">
    <input type="text" placeholder="Enter your Name" class="userName"><br />
    <input type="email" placeholder="Enter your Email" class="userEmail"><br />
    <input type="password" placeholder="Enter your Password" class="userPassword" > <br />
    <input type="password" placeholder="Confirm your Password"> <br />
    <div class="gender">
        <label >
            <input type="radio" name="gender">Male
        </label>
        <label >
            <input type="radio" name="gender">Female
        </label>
    </div>
    <br />
  <div class="cc">
    <input type="checkbox">
    <label>Do you agree with our terms&Conditions</label>
</div>
    <div class="bb">
    <button onclick="goSign()">SignUp</button>
    <a href="./Login.html" class="slog">Continue with Email</a>
    </div>
    </div>
    </form>
      <footer class="footer">
    <div class="footer-nav"> 
        <h2>Todo App</h2>
        <p>&copy; 2026 Todo App. All rights reserved. Made with ❤️ by Awan.</p>
    </div>

</footer>
    <script src="./script.js"></script>
</body>
</html>
